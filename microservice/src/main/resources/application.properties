spring.application.name=activity-service
server.port=8081

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:netex}
spring.datasource.username=${POSTGRES_USER:netex}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=activity
spring.flyway.clean-disabled=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=activity-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Only a basic health status is exposed; details stay private.
management.endpoints.web.base-path=/internal
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
