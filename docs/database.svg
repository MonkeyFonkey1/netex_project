<rect x="861" y="472" width="518" height="44" fill="#ffffff"/><line x1="860" y1="472" x2="1380" y2="472" stroke="#d5e0e6"/>
<text x="925" y="500" font-size="17" fill="#183642" font-weight="normal">created_at</text>
<text x="1206" y="500" font-size="15" fill="#647784" font-weight="normal">TIMESTAMPTZ</text>
<rect x="861" y="516" width="518" height="44" fill="#ffffff"/><line x1="860" y1="516" x2="1380" y2="516" stroke="#d5e0e6"/>
