<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1350" viewBox="0 0 1440 1350" role="img" aria-labelledby="title desc"><title id="title">Netex — diagrama bazei de date implementate</title><desc id="desc">Un utilizator poate crea zero sau mai multe contacte. Schema public păstrează evenimentele în așteptarea livrării, iar schema activity stochează evenimentele procesate, fără chei externe SQL către tabelele aplicației principale.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#137c73"/></marker></defs><rect width="1440" height="1350" fill="#f5f8fa"/><g font-family="Arial, sans-serif">
<text x="60" y="52" font-size="15" fill="#137c73" font-weight="bold">NETEX / STRUCTURA DATELOR</text>
<text x="60" y="101" font-size="36" fill="#183642" font-weight="bold">Conturi, contacte și activitate</text>
<text x="60" y="138" font-size="18" fill="#647784" font-weight="normal">BAZA NETEX · schemele public și activity · migrări Flyway separate</text>
<rect x="60" y="190" width="520" height="282" rx="8" fill="#ffffff" stroke="#d5e0e6"/>
<path d="M68 190 H572 Q580 190 580 198 V252 H60 V198 Q60 190 68 190" fill="#183642"/>
<text x="78" y="218" font-size="23" fill="#ffffff" font-weight="bold">users</text>
<text x="78" y="239" font-size="14" fill="#c7dedc" font-weight="normal">Conturile de acces la aplicație</text>
