<text x="608" y="505" font-size="16" fill="#254252" font-weight="normal">Un utilizator poate</text>
<text x="608" y="529" font-size="16" fill="#254252" font-weight="normal">crea mai multe contacte.</text>
<rect x="60" y="465" width="520" height="95" rx="8" fill="#eaf1f5" stroke="#d5e0e6"/>
<text x="78" y="496" font-size="17" fill="#183642" font-weight="bold">Fiecare contact are exact un autor.</text>
<text x="78" y="526" font-size="16" fill="#526976" font-weight="normal">Cheia externă indică ID-ul contului care l-a creat.</text>
<rect x="60" y="622" width="640" height="124" rx="8" fill="#ffffff" stroke="#d5e0e6"/>
<text x="80" y="656" font-size="21" fill="#183642" font-weight="bold">flyway_schema_history</text>
<text x="80" y="687" font-size="16" fill="#526976" font-weight="normal">Tabel tehnic, creat automat de Flyway la integrare.</text>
<text x="80" y="716" font-size="16" fill="#526976" font-weight="normal">Ține evidența migrărilor SQL. Fără relație FK cu agenda.</text>
<rect x="740" y="622" width="640" height="124" rx="8" fill="#ffffff" stroke="#d5e0e6"/>
<text x="760" y="656" font-size="21" fill="#183642" font-weight="bold">activity-service</text>
<text x="760" y="687" font-size="16" fill="#526976" font-weight="normal">Tabelele și stocarea istoricului urmează să fie proiectate.</text>
<text x="760" y="716" font-size="16" fill="#526976" font-weight="normal">Le vom adăuga în diagramă la implementarea serviciului.</text>
<text x="60" y="803" font-size="17" fill="#254252" font-weight="normal">PK = identificator unic     UK = valoare unică     FK = referință către alt tabel</text>
<text x="60" y="840" font-size="16" fill="#647784" font-weight="normal">Fotografiile sunt fișiere; picture_path păstrează referința. updated_at va fi actualizat de backend.</text>
<text x="60" y="874" font-size="15" fill="#647784" font-weight="normal">Documentația coloanelor: docs/database.md · diagramă editabilă: docs/database.drawio</text>
