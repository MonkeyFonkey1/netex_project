<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="910" viewBox="0 0 1440 910" role="img" aria-labelledby="title desc"><title id="title">Netex — diagrama bazei de date propuse</title><desc id="desc">Un utilizator poate crea zero sau mai multe contacte. contacts.created_by_user_id face referire la users.id. Tabelele nu sunt încă implementate.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#137c73"/></marker></defs><rect width="1440" height="910" fill="#f5f8fa"/><g font-family="Arial, sans-serif">
