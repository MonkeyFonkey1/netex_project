<path d="M860 450 H735 V274 H585" stroke="#137c73" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="603" y="259" font-size="19" fill="#137c73" font-weight="bold">1</text>
<text x="798" y="432" font-size="19" fill="#137c73" font-weight="bold">0..N</text>
<text x="608" y="505" font-size="16" fill="#254252" font-weight="normal">Un utilizator poate</text>
<text x="608" y="529" font-size="16" fill="#254252" font-weight="normal">crea mai multe contacte.</text>
<rect x="60" y="500" width="520" height="95" rx="8" fill="#eaf1f5" stroke="#d5e0e6"/>
<text x="78" y="531" font-size="17" fill="#183642" font-weight="bold">Fiecare contact are exact un autor.</text>
<text x="78" y="561" font-size="16" fill="#526976" font-weight="normal">Cheia externă indică ID-ul contului care l-a creat.</text>
<rect x="60" y="622" width="640" height="124" rx="8" fill="#ffffff" stroke="#d5e0e6"/>
<text x="80" y="656" font-size="21" fill="#183642" font-weight="bold">flyway_schema_history</text>
<text x="80" y="687" font-size="16" fill="#526976" font-weight="normal">Tabel tehnic, creat automat de Flyway.</text>
<text x="80" y="716" font-size="16" fill="#526976" font-weight="normal">Schema public; activity are propriul istoric Flyway.</text>
<rect x="740" y="622" width="640" height="235" rx="8" fill="#ffffff" stroke="#d5e0e6"/>
<path d="M748 622 H1372 Q1380 622 1380 630 V666 H740 V630 Q740 622 748 622" fill="#183642"/>
<text x="760" y="650" font-size="21" fill="#ffffff" font-weight="bold">activity.signup_events</text>
<text x="760" y="689" font-size="16" fill="#183642" font-weight="bold">PK   user_id</text><text x="1200" y="689" font-size="15" fill="#647784">BIGINT</text>
<text x="810" y="728" font-size="16" fill="#183642">email</text><text x="1200" y="728" font-size="15" fill="#647784">VARCHAR(254)</text>
<text x="810" y="767" font-size="16" fill="#183642">signed_up_at</text><text x="1200" y="767" font-size="15" fill="#647784">TIMESTAMPTZ</text>
<text x="810" y="806" font-size="16" fill="#183642">processed_at</text><text x="1200" y="806" font-size="15" fill="#647784">TIMESTAMPTZ</text>
<text x="760" y="840" font-size="14" fill="#526976">Fără FK SQL; user_id vine din mesajul Kafka.</text>
<rect x="60" y="770" width="640" height="280" rx="8" fill="#ffffff" stroke="#d5e0e6"/>
<path d="M68 770 H692 Q700 770 700 778 V814 H60 V778 Q60 770 68 770" fill="#183642"/>
<text x="80" y="799" font-size="21" fill="#ffffff" font-weight="bold">activity.contact_events</text>
<text x="80" y="842" font-size="16" fill="#183642" font-weight="bold">PK   event_id</text><text x="520" y="842" font-size="15" fill="#647784">UUID</text>
<text x="130" y="878" font-size="16" fill="#183642">contact_id</text><text x="520" y="878" font-size="15" fill="#647784">BIGINT</text>
<text x="130" y="914" font-size="16" fill="#183642">actor_user_id</text><text x="520" y="914" font-size="15" fill="#647784">BIGINT</text>
<text x="130" y="950" font-size="16" fill="#183642">action</text><text x="520" y="950" font-size="15" fill="#647784">VARCHAR(7)</text>
<text x="130" y="986" font-size="16" fill="#183642">occurred_at</text><text x="520" y="986" font-size="15" fill="#647784">TIMESTAMPTZ</text>
<text x="130" y="1022" font-size="16" fill="#183642">processed_at</text><text x="520" y="1022" font-size="15" fill="#647784">TIMESTAMPTZ</text>
<rect x="740" y="880" width="640" height="300" rx="8" fill="#ffffff" stroke="#d5e0e6"/>
<path d="M748 880 H1372 Q1380 880 1380 888 V924 H740 V888 Q740 880 748 880" fill="#183642"/>
<text x="760" y="909" font-size="21" fill="#ffffff" font-weight="bold">public.event_outbox</text>
<text x="760" y="951" font-size="16" fill="#183642" font-weight="bold">PK   id</text><text x="1200" y="951" font-size="15" fill="#647784">BIGINT</text>
<text x="810" y="983" font-size="16" fill="#183642">destination</text><text x="1200" y="983" font-size="15" fill="#647784">VARCHAR(24)</text>
<text x="810" y="1015" font-size="16" fill="#183642">event_key</text><text x="1200" y="1015" font-size="15" fill="#647784">VARCHAR(64)</text>
<text x="810" y="1047" font-size="16" fill="#183642">payload</text><text x="1200" y="1047" font-size="15" fill="#647784">TEXT</text>
<text x="810" y="1079" font-size="16" fill="#183642">created_at</text><text x="1200" y="1079" font-size="15" fill="#647784">TIMESTAMPTZ</text>
<text x="810" y="1111" font-size="16" fill="#183642">next_attempt_at</text><text x="1200" y="1111" font-size="15" fill="#647784">TIMESTAMPTZ</text>
<text x="810" y="1143" font-size="16" fill="#183642">attempts</text><text x="1200" y="1143" font-size="15" fill="#647784">INTEGER</text>
<text x="60" y="1245" font-size="17" fill="#254252" font-weight="normal">PK = identificator unic     UK = valoare unică     FK = referință către alt tabel</text>
<text x="60" y="1282" font-size="16" fill="#647784" font-weight="normal">picture_path poate fi NULL. Evenimentele din activity nu conțin parole sau hashuri.</text>
<text x="60" y="1316" font-size="15" fill="#647784" font-weight="normal">Documentația coloanelor: docs/database.md · diagramă editabilă: docs/database.drawio</text>
