<text x="60" y="101" font-size="36" fill="#183642" font-weight="bold">Conturi și contacte</text>
<text x="60" y="138" font-size="18" fill="#647784" font-weight="normal">SCHEMĂ PROPUSĂ · tabelele nu sunt încă create · baza netex / schema public</text>
<rect x="60" y="190" width="520" height="238" rx="8" fill="#ffffff" stroke="#d5e0e6"/>
