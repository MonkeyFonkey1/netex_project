<text x="76" y="280" font-size="13" fill="#137c73" font-weight="bold">PK</text>
<text x="125" y="280" font-size="17" fill="#183642" font-weight="normal">id</text>
<text x="406" y="280" font-size="15" fill="#647784" font-weight="normal">BIGINT</text>
<rect x="61" y="296" width="518" height="44" fill="#ffffff"/><line x1="60" y1="296" x2="580" y2="296" stroke="#d5e0e6"/>
<text x="76" y="324" font-size="13" fill="#137c73" font-weight="bold">UK</text>
<text x="125" y="324" font-size="17" fill="#183642" font-weight="normal">email</text>
