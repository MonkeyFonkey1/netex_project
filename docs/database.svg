<text x="125" y="412" font-size="17" fill="#183642" font-weight="normal">role</text>
<text x="406" y="412" font-size="15" fill="#647784" font-weight="normal">VARCHAR(16)</text>
<rect x="61" y="428" width="518" height="44" fill="#ffffff"/><line x1="60" y1="428" x2="580" y2="428" stroke="#d5e0e6"/>
<text x="125" y="456" font-size="17" fill="#183642" font-weight="normal">created_at</text>
<text x="406" y="456" font-size="15" fill="#647784" font-weight="normal">TIMESTAMPTZ</text>
<rect x="860" y="190" width="520" height="370" rx="8" fill="#ffffff" stroke="#d5e0e6"/>
<path d="M868 190 H1372 Q1380 190 1380 198 V252 H860 V198 Q860 190 868 190" fill="#183642"/>
<text x="878" y="218" font-size="23" fill="#ffffff" font-weight="bold">contacts</text>
<text x="878" y="239" font-size="14" fill="#c7dedc" font-weight="normal">Persoanele din agenda publică</text>
<rect x="861" y="252" width="518" height="44" fill="#ffffff"/><line x1="860" y1="252" x2="1380" y2="252" stroke="#d5e0e6"/>
<text x="876" y="280" font-size="13" fill="#137c73" font-weight="bold">PK</text>
<text x="925" y="280" font-size="17" fill="#183642" font-weight="normal">id</text>
<text x="1206" y="280" font-size="15" fill="#647784" font-weight="normal">BIGINT</text>
<rect x="861" y="296" width="518" height="44" fill="#ffffff"/><line x1="860" y1="296" x2="1380" y2="296" stroke="#d5e0e6"/>
<text x="925" y="324" font-size="17" fill="#183642" font-weight="normal">name</text>
<text x="1206" y="324" font-size="15" fill="#647784" font-weight="normal">VARCHAR(255)</text>
<rect x="861" y="340" width="518" height="44" fill="#ffffff"/><line x1="860" y1="340" x2="1380" y2="340" stroke="#d5e0e6"/>
<text x="925" y="368" font-size="17" fill="#183642" font-weight="normal">address</text>
<text x="1206" y="368" font-size="15" fill="#647784" font-weight="normal">TEXT</text>
<rect x="861" y="384" width="518" height="44" fill="#ffffff"/><line x1="860" y1="384" x2="1380" y2="384" stroke="#d5e0e6"/>
<text x="925" y="412" font-size="17" fill="#183642" font-weight="normal">picture_path</text>
<text x="1206" y="412" font-size="15" fill="#647784" font-weight="normal">VARCHAR(255)</text>
<rect x="861" y="428" width="518" height="44" fill="#e3f3ef"/><line x1="860" y1="428" x2="1380" y2="428" stroke="#d5e0e6"/>
<text x="876" y="456" font-size="13" fill="#137c73" font-weight="bold">FK</text>
