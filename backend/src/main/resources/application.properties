spring.application.name=contacts-api
server.port=8080

# The local profile reads these values from the repository's root .env file.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:netex}
spring.datasource.username=${POSTGRES_USER:netex}
spring.datasource.password=${POSTGRES_PASSWORD:}

# Flyway owns schema changes; no separate schema.sql initializer is used.
spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.clean-disabled=true

# Laptop: localhost:9092. Docker backend: KAFKA_BOOTSTRAP_SERVERS=kafka:19092.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=3000

# Local microservice: localhost:8081. Compose uses the internal microservice hostname.
app.activity-service.url=${ACTIVITY_SERVICE_URL:http://localhost:8081}
spring.http.client.connect-timeout=1s
spring.http.client.read-timeout=2s

# Photos are files; SQL stores only their generated filenames.
app.picture-directory=${PICTURE_DIR:../uploads}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# Only a basic health status is exposed; details stay private.
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
